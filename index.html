<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Montesarchio - Live</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',Arial,sans-serif}
body{background:#080a0f;display:flex;justify-content:center;min-height:100vh;color:white}
.phone{width:100%;max-width:420px;background:linear-gradient(180deg,#0f1219 0%, #05070a 100%);min-height:100vh;position:relative;overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:22px 20px}
.logo{text-align:center}.logo h1{font-size:14px;line-height:1;font-weight:800}.logo span{font-size:9px;color:#00e5cc;letter-spacing:2px}
.live-dot{color:#ff2a2a;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}.live-dot:before{content:'';width:8px;height:8px;background:#ff2a2a;border-radius:50%;box-shadow:0 0 10px #ff2a2a;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.card{margin:10px 18px;background:linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(0,229,204,0.05) 100%);border:1px solid rgba(0,229,204,0.25);border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.listeners{background:#00e5cc;color:#001a18;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800}
.main{margin:22px 18px;background:radial-gradient(ellipse at center, rgba(0,229,204,0.08) 0%, rgba(0,0,0,0) 70%), linear-gradient(180deg, rgba(20,25,35,0.9) 0%, rgba(10,12,18,0.9) 100%);border:1px solid rgba(0,229,204,0.15);border-radius:28px;padding:28px 20px 22px;text-align:center}
.onair{color:#00e5cc;font-size:13px;font-weight:800;letter-spacing:4px;margin-bottom:18px;text-shadow:0 0 15px #00e5cc}
.play-wrap{width:180px;height:180px;margin:0 auto;position:relative;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(0,229,204,0.3)}.ring1{width:100%;height:100%;animation:pulse 2s infinite}.ring2{width:130%;height:130%;border-color:rgba(0,229,204,0.15);animation:pulse 2s infinite 0.5s}.ring3{width:160%;height:160%;border-color:rgba(0,229,204,0.07);animation:pulse 2s infinite 1s}
@keyframes pulse{0%{transform:scale(0.9);opacity:1}100%{transform:scale(1.15);opacity:0}}
.play-btn{width:110px;height:110px;background:radial-gradient(circle at 30% 30%, #7afff0, #00e5cc);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 40px rgba(0,229,204,0.6), inset 0 2px 10px rgba(255,255,255,0.8);z-index:2;transition:0.2s}
.play-btn svg{width:38px;height:38px;margin-left:5px;fill:#001a18}
.fallback{margin-top:16px;background:#ff3b3b;color:white;border-radius:12px;padding:10px;font-size:12px;font-weight:700;display:none;text-decoration:none}
.whatsapp{margin:16px 18px;background:linear-gradient(135deg, rgba(0,229,204,0.12) 0%, rgba(0,229,204,0.04) 100%);border:1px solid rgba(0,229,204,0.3);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;text-decoration:none}
.wa-icon{width:44px;height:44px;background:#00e5cc;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.whatsapp b{color:white;font-size:14px;display:block}.whatsapp p{color:#8aa99a;font-size:10px;margin-top:2px}
.bottom{position:sticky;bottom:0;background:rgba(5,7,10,0.9);backdrop-filter:blur(20px);border-top:1px solid rgba(0,229,204,0.1);display:flex;justify-content:space-around;padding:12px 0 20px;margin-top:20px}
.b-item{text-align:center;color:#4a5a6a;font-size:10px}.b-item.active{color:#00e5cc}.b-item div{font-size:20px;margin-bottom:3px}
</style>
</head>
<body>
<div class="phone">
  <div class="topbar"><div>☰</div><div class="logo"><h1>RADIO<br>MONTESARCHIO</h1><span>VALLE CAUDINA</span></div><div class="live-dot">LIVE</div></div>
  <div class="card"><div><b style="color:#00e5cc;font-size:12px">IN DIRETTA ORA</b><p style="font-size:10px;color:#8a9aaa">Programma del Mattino</p></div><div class="listeners">🎧 2 ascoltatori</div></div>
  <div class="main">
    <div class="onair">ON AIR</div>
    <div class="play-wrap"><div class="ring ring1"></div><div class="ring ring2"></div><div class="ring ring3"></div>
      <div class="play-btn" id="playBtn" onclick="togglePlay()"><svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg><svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></div>
    </div>
    <p id="status" style="margin-top:15px;font-size:11px;color:#00e5cc">Clicca PLAY per ascoltare</p>
    <a id="fallbackBtn" class="fallback" href="http://sapircast.caster.fm:17620/" target="_blank">⚠️ iPhone blocca l'audio - CLICCA QUI PER ASCOLTARE</a>
    <audio id="audio" preload="none"><source src="https://sapircast.caster.fm:17620/" type="audio/mpeg"><source src="http://sapircast.caster.fm:17620/" type="audio/mpeg"></audio>
  </div>
  <a class="whatsapp" href="https://wa.me/393291465093?text=Ciao%20Radio%20Montesarchio!" target="_blank"><div class="wa-icon">💬</div><div><b>Salutaci su WhatsApp</b><p>329 146 5093 - Mandaci un vocale in diretta!</p></div></a>
  <div class="bottom"><div class="b-item active"><div>⌂</div>Diretta</div><div class="b-item"><div>◉</div>Podcast</div><div class="b-item"><div>📰</div>News</div><div class="b-item"><div>👤</div>Profilo</div></div>
</div>
<script>
let playing=false;
const audio=document.getElementById('audio');
function togglePlay(){
  const p1=document.getElementById('iconPlay'); const p2=document.getElementById('iconPause'); const st=document.getElementById('status'); const fb=document.getElementById('fallbackBtn');
  if(!playing){
    audio.play().then(()=>{
      playing=true; p1.style.display='none'; p2.style.display='block'; st.innerText='🔊 In Diretta • Live'; fb.style.display='none';
    }).catch(()=>{
      st.innerText='iPhone ha bloccato, usa il tasto rosso sotto'; fb.style.display='block'; window.open('http://sapircast.caster.fm:17620/pr123.m3u','_blank');
    });
    // Se dopo 2 sec non parte, mostra fallback
    setTimeout(()=>{ if(audio.paused){ fb.style.display='block'; } },2000);
  }else{
    audio.pause(); playing=false; p1.style.display='block'; p2.style.display='none'; st.innerText='Clicca PLAY per ascoltare';
  }
}
</script>
</body>
</html>
