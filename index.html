<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Montesarchio</title>
<style>
body{background:#111;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#222;padding:30px;border-radius:20px;text-align:center;max-width:350px;width:90%}
.onair{color:#0f0;border:1px solid #0f0;display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;margin-bottom:15px}
#pb{width:80px;height:80px;border-radius:50%;border:none;background:#ff0055;color:#fff;font-size:35px;cursor:pointer;margin-top:20px}
.track{margin:15px 0}
.btns{display:flex;gap:10px;justify-content:center;margin-top:15px}
.btn{background:#333;padding:8px 15px;border-radius:20px;font-size:12px}
</style>
</head>
<body>
<div class="card">
<div class="onair">ON AIR</div>
<div class="track"><small>IN RIPRODUZIONE</small><h2>Radio Montesarchio</h2><div style="font-size:11px;opacity:.5" id="ct">00:00</div></div>
<div class="btns"><div class="btn">Favoriti</div><div class="btn">Condividi</div></div>
<button id="pb">▶</button>
<audio id="a" preload="none" crossorigin="anonymous"></audio>
</div>
<script>
const STREAM="https://sapircast.caster.fm:17620/prlZ3";
let pl=false,sec=0;
const a=document.getElementById('a'), pb=document.getElementById('pb'), ct=document.getElementById('ct');
pb.onclick=()=>{
if(!pl){
a.src=STREAM;
a.play().then(()=>{pl=true;pb.textContent="II"}).catch((e)=>{alert("Errore: "+e.message)});
}else{
a.pause();a.src="";pl=false;pb.textContent="▶";sec=0;ct.textContent="00:00";
}
};
setInterval(()=>{if(!pl)return;sec++;let m=String(Math.floor(sec/60)).padStart(2,'0');let s=String(sec%60).padStart(2,'0');ct.textContent=m+":"+s;},1000);
</script>
</body>
</html>
